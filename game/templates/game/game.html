{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lancer Advancer — Room</title>
  <link rel="stylesheet" href="{% static 'game/css/styles.css' %}" />
</head>
<body>
  <main class="game">
    <header class="game-header">
      <a class="back-link" href="/">&larr; Lobby</a>
      <span id="status" class="status">Connecting…</span>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="480" height="320"></canvas>
      <div class="dice-3d">
      <div id="die" class="die hidden" aria-hidden="true">
        <div class="die__cube">
          <div class="die__face die__face--1 side front">
            <span class="dot center"></span>
          </div>

          <div class="die__face die__face--2 side top">
            <span class="dot dtop dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>

          <div class="die__face die__face--3 side right">
            <span class="dot dtop dleft"></span>
            <span class="dot center"></span>
            <span class="dot dbottom dright"></span>
          </div>

          <div class="die__face die__face--4 side left">
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>

          <div class="die__face die__face--5 side bottom">
            <span class="dot center"></span>
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>

          <div class="die__face die__face--6 side back">
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
            <span class="dot center dleft"></span>
            <span class="dot center dright"></span>
          </div>
        </div>
      </div>
      </div>
    </div>

    <div class="controls">
      <div class="controls-row">
        <span id="dice-tray" class="dice-tray">
          <span id="turn-roll-indicator" class="turn-roll-indicator hidden" aria-hidden="true"></span>
          <span id="turn-roll-indicator-2" class="turn-roll-indicator hidden" aria-hidden="true"></span>
        </span>
        <button id="turn-btn" class="btn btn-primary" disabled>Roll Dice</button>
      </div>
      <div class="controls-row controls-row-split">
        <button id="pass-btn" class="btn btn-secondary" disabled>Pass</button>
        <button id="resign-btn" class="btn btn-danger" disabled>Resign</button>
      </div>
    </div>
  </main>

  <!-- Result / error popup -->
  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <a class="btn btn-primary" href="/">Back to Lobby</a>
    </div>
  </div>

  <script>
    window.ROOM_ID = "{{ room_id|escapejs }}";
    window.SERVER_BUILD_ID = "{{ build_id|escapejs }}";
    window.LANCE_BG_URL = "{% static 'game/img/lance_background.svg' %}";
    window.HELMET_BG_URL = "{% static 'game/img/helmet-background.svg' %}";
    window.CHECK_BG_URL = "{% static 'game/img/check-background.svg' %}";
  </script>
  <script src="{% static 'game/js/game.js' %}"></script>
</body>
</html>
