{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lancer Advancer — Room</title>
  <link rel="stylesheet" href="{% static 'game/css/styles.css' %}" />
</head>
<body>
  <main class="game">
    <header class="game-header">
      <a class="back-link" href="/">&larr; Lobby</a>
      <span id="status" class="status">Connecting…</span>
    </header>

    <div class="board-wrap">
      <canvas id="board" width="480" height="320"></canvas>
      <div id="die" class="die hidden" aria-hidden="true">
        <div class="die__cube">
          <div class="die__face die__face--1 side front">
            <span class="dot center"></span>
          </div>
          <div class="die__face die__face--1 die__face--inner side front inner"></div>

          <div class="die__face die__face--2 side top">
            <span class="dot dtop dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>
          <div class="die__face die__face--2 die__face--inner side top inner"></div>

          <div class="die__face die__face--3 side right">
            <span class="dot dtop dleft"></span>
            <span class="dot center"></span>
            <span class="dot dbottom dright"></span>
          </div>
          <div class="die__face die__face--3 die__face--inner side right inner"></div>

          <div class="die__face die__face--4 side left">
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>
          <div class="die__face die__face--4 die__face--inner side left inner"></div>

          <div class="die__face die__face--5 side bottom">
            <span class="dot center"></span>
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
          </div>
          <div class="die__face die__face--5 die__face--inner side bottom inner"></div>

          <div class="die__face die__face--6 side back">
            <span class="dot dtop dleft"></span>
            <span class="dot dtop dright"></span>
            <span class="dot dbottom dleft"></span>
            <span class="dot dbottom dright"></span>
            <span class="dot center dleft"></span>
            <span class="dot center dright"></span>
          </div>
          <div class="die__face die__face--6 die__face--inner side back inner"></div>

          <div class="die__face die__cover die__cover--x"></div>
          <div class="die__face die__cover die__cover--y"></div>
          <div class="die__face die__cover die__cover--z"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="turn-btn" class="btn btn-primary" disabled>Roll Die</button>
      <button id="resign-btn" class="btn btn-danger" disabled>Resign</button>
    </div>
  </main>

  <!-- Result / error popup -->
  <div id="overlay" class="overlay hidden">
    <div class="modal">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <a class="btn btn-primary" href="/">Back to Lobby</a>
    </div>
  </div>

  <script>
    window.ROOM_ID = "{{ room_id|escapejs }}";
  </script>
  <script src="{% static 'game/js/game.js' %}"></script>
</body>
</html>
