# fly.toml app configuration file generated for lancer-advancer on 2026-07-03T20:28:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lancer-advancer'
primary_region = 'iad'
console_command = '/code/manage.py shell'

[build]

[env]
  DJANGO_ALLOWED_HOSTS = 'lancer-advancer.fly.dev'
  DJANGO_CSRF_TRUSTED_ORIGINS = 'https://lancer-advancer.fly.dev'
  DJANGO_DEBUG = 'false'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
