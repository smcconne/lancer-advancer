# fly.toml — Lancer Advancer
#
# CRITICAL: this app keeps all game state and the Channels layer in memory, so
# it MUST run as a single machine. After the first deploy, pin the count:
#     fly scale count 1
# and set the secret key:
#     fly secrets set DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(50))')"

app = "lancer-advancer"
primary_region = "iad"

[build]

[env]
  DJANGO_DEBUG = "false"
  DJANGO_ALLOWED_HOSTS = "lancer-advancer.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://lancer-advancer.fly.dev"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "off"   # keep the single machine warm for realtime play
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
